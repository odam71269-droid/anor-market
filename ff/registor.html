<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ro‘yxatdan o‘tish — AnorMarket</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="./img.ico">
  <style>
    .card{border:1px solid #e5e7eb;border-radius:14px;padding:18px;max-width:480px;width:92vw;background:#fff;box-shadow:0 8px 26px rgba(0,0,0,.06)}
    .container{height:100vh;display:grid;place-items:center}
    label{display:grid;gap:6px;margin:8px 0}
    input{padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;font-size:16px}
    .btn{border:0;background:#111827;color:#fff;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer;margin-top:6px}
    a{color:#111827}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2 style="margin-bottom:8px">Ro‘yxatdan o‘tish</h2>
      <form id="regForm">
        <label>To‘liq ism
          <input type="text" name="name" required>
        </label>
        <label>Telefon raqam
          <input type="tel" name="phone" required>
        </label>
        <label>Email
          <input type="email" name="email" required>
        </label>
        <label>Parol
          <input type="password" name="password" minlength="6" required>
        </label>
        <button class="btn" type="submit">Ro‘yxatdan o‘tish</button>
      </form>
      <p style="margin-top:8px">Akkaunt bor? <a href="login.html">Kirish</a></p>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    document.getElementById('regForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      try{
        const users = JSON.parse(localStorage.getItem('am_users')||'{}');
        const email = (fd.get('email')||'').trim().toLowerCase();
        if(users[email]) throw new Error('Bu email bilan foydalanuvchi mavjud');
        users[email] = { name: fd.get('name'), phone: fd.get('phone'), passHash: btoa(fd.get('password')), createdAt: Date.now() };
        localStorage.setItem('am_users', JSON.stringify(users));
        localStorage.setItem('am_session_user', email);
        window.location.href = 'index.html';
      }catch(err){ alert(err.message); }
    });
  </script>
</body>
</html>
