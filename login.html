<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kirish — AnorMarket</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="./img.ico">
  <style>
    .card{border:1px solid #e5e7eb;border-radius:14px;padding:18px;max-width:420px;width:92vw;background:#fff;box-shadow:0 8px 26px rgba(0,0,0,.06)}
    .container{height:100vh;display:grid;place-items:center}
    label{display:grid;gap:6px;margin:8px 0}
    input{padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;font-size:16px}
    .btn{border:0;background:#111827;color:#fff;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer;margin-top:6px}
    a{color:#111827}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2 style="margin-bottom:8px">Kirish</h2>
      <form id="loginForm">
        <label>Email
          <input type="email" name="email" required>
        </label>
        <label>Parol
          <input type="password" name="password" required>
        </label>
        <button class="btn" type="submit">Kirish</button>
      </form>
      <p style="margin-top:8px">Akkaunt yo‘qmi? <a href="registor.html">Ro‘yxatdan o‘tish</a></p>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      try{
        const email = fd.get('email'); const password = fd.get('password');
        // use shared auth
        (function(){
          const users = JSON.parse(localStorage.getItem('am_users')||'{}');
          if(!users[email]) throw new Error('Akkaunt topilmadi');
          if(users[email].passHash !== btoa(password)) throw new Error('Parol noto‘g‘ri');
          localStorage.setItem('am_session_user', email);
        })();
        window.location.href = 'index.html';
      }catch(err){ alert(err.message); }
    });
  </script>
</body>
</html>
